services:
  postgres:
    image: postgres:16
    container_name: oh_richi_postgres
    restart: always
    environment:
      POSTGRES_USER: oh_richi_admin
      POSTGRES_PASSWORD: oh_richi_password
      POSTGRES_DB: oh_richi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: oh_richi_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ohrichi.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
